<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Shop List</h2>
<div id="shopList"></div>

<button onclick="addShop()">➕ Add Shop</button>


<script type="module">
import { db, collection, addDoc } from "./firebase.js";
window.addShop = async function () {
  const shopName = prompt("Shop Name");
  if (!shopName) return;

  const place = prompt("Place");
  if (!place) return;

  await addDoc(collection(db, "shops"), {
    name: shopName,
    place: place,
    created: new Date()
  });

  alert("Shop Saved Successfully");
};
</script>
</body>
</html>
