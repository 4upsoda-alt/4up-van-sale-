<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Shop List</h2>

<button onclick="addShop()">➕ Add Shop</button>

<hr>

<div>
<h3>ABC Stores</h3>
<p>📍 Mannarkkad</p>
<button>🧾 Bill</button>
<button>🗺️ Route</button>
</div>

<hr>

<div>
<h3>City Bakery</h3>
<p>📍 Palakkad</p>
<button>🧾 Bill</button>
<button>🗺️ Route</button>
</div>
<script type="module" src="firebase.js"></script>
<script type="module">
window.addShop = async function () {
  const shopName = prompt("Shop Name");
  if (!shopName) return;

  const place = prompt("Place");
  if (!place) return;

  await addDoc(collection(db, "shops"), {
    name: shopName,
    place: place,
    created: new Date()
  });

  alert("Shop Saved Successfully");
};
</script>
</body>
</html>
